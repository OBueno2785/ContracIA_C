[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contractia"
version = "0.3.0"
description = "Auditoría contractual multi-agente con GraphRAG sobre la API de Claude"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.14",
    "pydantic>=2",
    "networkx>=3",
    "tenacity>=8",
    "tqdm>=4",
    "matplotlib>=3.8",
    "pypdf>=4",
    "python-docx>=1.1",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
contractia = "contractia.__main__:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
